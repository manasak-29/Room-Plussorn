<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ขอบคุณสำหรับการสั่งซื้อ | Room Plussorn</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .thankyou-card {
      max-width: 600px;
      margin: var(--spacing-xl) auto;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      padding: var(--spacing-xl) var(--spacing-lg);
      text-align: center;
    }
  </style>
</head>
<body>

  <main class="section" style="min-height: 80vh; display: flex; align-items: center;">
    <div class="container">
      <div class="thankyou-card">
        <span class="sub-title">Thank You For Your Order</span>
        <h1 style="margin: 0.5rem 0 1rem; font-size: clamp(2rem, 4vw, 2.8rem);">ขอบคุณสำหรับคำสั่งซื้อ</h1>
        <div class="mood-line" style="margin: 0 auto 1.5rem; background-color: var(--color-accent-gold);"></div>
        
        <p style="margin: 0 auto 2rem; color: var(--color-text-muted); line-height: 1.8;">
          ทางเราได้รับข้อมูลการสั่งซื้อของคุณเรียบร้อยแล้ว<br>
          ทีมงาน Room Plussorn กำลังตระเตรียมและจัดส่งกลิ่นหอมอันประณีตถึงคุณโดยเร็วที่สุด
        </p>

        <a href="index.html" class="btn btn-primary" style="display: inline-flex; width: auto; min-width: 200px;">
          กลับสู่หน้าแรก
        </a>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
